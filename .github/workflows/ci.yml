name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Check JS syntax
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*" | while read f; do
            node --check "$f" 2>&1 || true
          done

      - name: Run ESLint
        run: npm run lint

      - name: Validate manifest.json
        run: |
          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const required = ['manifest_version', 'name', 'version', 'description', 'permissions', 'background', 'icons'];
          const missing = required.filter(f => !manifest[f]);
          if (missing.length > 0) {
            console.error('manifest.json 缺少字段:', missing.join(', '));
            process.exit(1);
          }
          if (manifest.manifest_version !== 3) {
            console.error('manifest_version 必须为 3');
            process.exit(1);
          }
          console.log('✅ manifest.json 验证通过');
          "

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      # R295: TestInfraReliability — 基础设施预检
      # preflight 失败标记为基础设施错误而非测试失败
      - name: Preflight - Test infrastructure check
        run: bash scripts/test-preflight.sh

      # R296: 测试执行性能回归防火墙 — 包装 test:ci，硬性门禁 ≤37s
      - name: Run unit tests with performance gate
        run: bash scripts/check-test-time.sh

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Coverage gate (lines >= 28%, branches >= 75%, functions >= 50%)
        run: npm run coverage:gate

      - name: Coverage regression check
        run: bash scripts/architecture-guard.sh

  package-check:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Check package size
        run: |
          TOTAL_SIZE=$(du -sb background content sidebar popup options lib skills icons _locales manifest.json 2>/dev/null | tail -1 | cut -f1)
          echo "核心文件大小: ${TOTAL_SIZE} bytes"

          MAX_SIZE=10485760
          if [ "$TOTAL_SIZE" -gt "$MAX_SIZE" ]; then
            echo "⚠️ 核心文件超过 10MB 限制"
            exit 1
          fi
          echo "✅ 包体积检查通过"

  chrome-e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    # R288: 从 soft-fail 升级为正式门禁 — E2E 冒烟测试稳定化
    # continue-on-error: true  ← 已移除 (R288)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium --with-deps

      - name: Run E2E Chrome tests
        run: npm run test:e2e
